name: SwingDesk scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1,5,9,13,17,21 * * *"   # every 4 hours, every day (crypto is 24/7; equities use completed bars)
    - cron: "0 14 * * 0"               # Sunday 14:00 UTC: weekly run with the backtest
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: swingdesk
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack a new code zip if one was uploaded (keeps your config.yaml and holdings.yaml)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d .bundle
            SRC=$(dirname "$(find .bundle -maxdepth 3 -name run.py | head -1)")
            rm -rf "$SRC/.github"
            [ -f config.yaml ] && cp config.yaml .bundle/old_config.yaml
            cp -r "$SRC"/. .
            [ -f .bundle/old_config.yaml ] && python3 scripts/merge_config.py .bundle/old_config.yaml config.yaml
            rm -rf .bundle "$ZIP"
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add -A
            git commit -m "Update SwingDesk code from $ZIP"
            git push
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the scan
        run: |
          EXTRA=""
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "14" ]; then EXTRA="--with-backtest"; fi
          python run.py scan --top 15 --live $EXTRA
      - run: python scripts/build_site.py
      - name: Keep the latest outputs in the repo (history/latest)
        run: |
          rm -rf history/latest && mkdir -p history/latest
          cp -r output/. history/latest/
          cp site/index.html history/latest/briefing.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add history
          git commit -m "Briefing $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "no changes"
          git push || echo "push skipped"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: swingdesk-output-${{ github.run_id }}
          path: output
          retention-days: 90

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
